name: Verify / Main Baseline

# Re-verifies that the published baseline on main still installs, builds and passes the
# deterministic gates. Not a deployment.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-baseline
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Frontend dependencies install cleanly
        run: yarn install --frozen-lockfile

      - name: Tests
        run: yarn test --watchAll=false --passWithNoTests
        env:
          CI: true

      # Honors the "warn" severity configured in craco.config.js (see ci.yml).
      - name: Build
        run: yarn build
        env:
          CI: false

  backend:
    name: Backend baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Tesseract OCR eng+spa)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend dependencies install cleanly
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Generate synthetic fixtures
        run: python -c "from backend.fixtures_generator import generate_all_fixtures; generate_all_fixtures()"

      - name: Deterministic backend and security tests
        run: >-
          python -m pytest backend/tests -q
          --ignore=backend/tests/test_api_e2e.py
          --ignore=backend/tests/test_encrypted_ruleset_http.py
          --ignore=backend/tests/security/test_sensitive_log_leakage.py
