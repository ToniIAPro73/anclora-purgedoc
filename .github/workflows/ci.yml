name: CI / Development

on:
  push:
    branches: [development, staging, production]
  pull_request:
    branches: [development, staging, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # No frontend unit tests exist yet; the runner itself must still start cleanly.
      - name: Tests
        run: yarn test --watchAll=false --passWithNoTests
        env:
          CI: true

      # craco.config.js declares react-hooks/exhaustive-deps as "warn". CRA promotes every
      # warning to an error when CI=true, so the build honors the configured severity.
      # Compile errors and "error"-level lint rules still fail the build.
      - name: Build
        run: yarn build
        env:
          CI: false

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: sqlite:////tmp/purgedoc-ci.db
      AUTH_ADMIN_EMAILS: qa.purgedoc@anclora.local
      JWT_SECRET: ci-test-secret-purgedoc-jwt-key-minimum-32-chars
      ENABLE_DEV_FIXTURES: "true"
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Tesseract OCR eng+spa)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa
          tesseract --list-langs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Generate synthetic fixtures
        run: python -c "from backend.fixtures_generator import generate_all_fixtures; generate_all_fixtures()"

      - name: Deterministic backend and security tests
        run: >-
          python -m pytest backend/tests -q
          --ignore=backend/tests/test_api_e2e.py
          --ignore=backend/tests/test_encrypted_ruleset_http.py
          --ignore=backend/tests/security/test_sensitive_log_leakage.py

      - name: HTTP tests against local backend
        env:
          REACT_APP_BACKEND_URL: http://127.0.0.1:8001
        run: |
          python -m uvicorn backend.server:app --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf "$REACT_APP_BACKEND_URL/api/health" > /dev/null && break
            sleep 1
          done
          if ! curl -sf "$REACT_APP_BACKEND_URL/api/health"; then
            echo "::error::Backend did not become healthy"
            cat "$RUNNER_TEMP/uvicorn.log"
            exit 1
          fi
          python -m pytest -q \
            backend/tests/test_api_e2e.py \
            backend/tests/test_encrypted_ruleset_http.py \
            backend/tests/security/test_sensitive_log_leakage.py
