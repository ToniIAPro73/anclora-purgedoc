name: Promote / Environment

# Manual, human-gated promotion. Moves the target branch to the exact SHA already
# validated upstream. Fast-forward only: no merge, rebase, cherry-pick, new commit
# or force push.
#
# development -> staging -> production -> main

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Branch to promote into, or full chain"
        required: true
        type: choice
        options: [staging, production, main, full]
      source_sha:
        description: "Exact development SHA reviewed in Preview (required for full chain)"
        required: false
        type: string

permissions:
  statuses: read
  actions: read
  contents: write
concurrency:
  group: promote-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote:
    if: inputs.target != 'full'
    name: Promote to ${{ inputs.target }}
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source branch
        id: source
        run: |
          set -euo pipefail
          case "$TARGET" in
            staging) SOURCE=development ;;
            production) SOURCE=staging ;;
            main) SOURCE=production ;;
            *) echo "::error::Unsupported target: $TARGET"; exit 1 ;;
          esac
          echo "Promotion: $SOURCE -> $TARGET"
          echo "branch=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Resolve SHAs and verify fast-forward safety
        id: check
        env:
          SOURCE: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/$SOURCE:refs/remotes/origin/$SOURCE" "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"
          SOURCE_SHA="$(git rev-parse "origin/$SOURCE")"
          TARGET_SHA="$(git rev-parse "origin/$TARGET")"
          echo "Source ($SOURCE): $SOURCE_SHA"
          echo "Target ($TARGET): $TARGET_SHA"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          if [ "$SOURCE_SHA" = "$TARGET_SHA" ]; then
            echo "Target already at source SHA. Nothing to promote."
            echo "noop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" "$SOURCE_SHA"; then
            echo "::error::PROMOTION_BLOCKED_DIVERGENCE: $TARGET contains commits not present in $SOURCE."
            exit 1
          fi
          echo "noop=false" >> "$GITHUB_OUTPUT"

      - name: Verify successful CI for exact source SHA
        if: steps.check.outputs.noop == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.check.outputs.source_sha }}
        run: |
          set -euo pipefail
          RUNS_JSON="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&per_page=100")"
          SUCCESSFUL_RUNS="$(printf '%s' "$RUNS_JSON" | jq --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.name == "CI / Development" and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | length')"
          echo "Successful CI / Development runs for $SOURCE_SHA: $SUCCESSFUL_RUNS"
          if [ "$SUCCESSFUL_RUNS" -lt 1 ]; then
            echo "::error::PROMOTION_BLOCKED_CI_NOT_GREEN: no completed successful CI / Development run exists for the exact source SHA."
            exit 1
          fi

      # Plain (non-forced) push of an existing SHA: the server rejects anything that is not a
      # fast-forward, and no new commit is created.
      - name: Fast-forward target ref
        if: steps.check.outputs.noop == 'false'
        env:
          SOURCE_SHA: ${{ steps.check.outputs.source_sha }}
        run: |
          set -euo pipefail
          git push origin "$SOURCE_SHA:refs/heads/$TARGET"
          git fetch origin "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"
          PROMOTED_SHA="$(git rev-parse "origin/$TARGET")"
          if [ "$PROMOTED_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Post-promotion check failed: $TARGET is at $PROMOTED_SHA, expected $SOURCE_SHA."
            exit 1
          fi
          echo "$TARGET promoted to $SOURCE_SHA"
  promote_full:
    if: inputs.target == 'full'
    name: Promote development through staging, production, and main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote the full chain without waiting for environment checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "development" ]; then
            echo "::error::PROMOTION_BLOCKED_WRONG_REF: dispatch this workflow from development."
            exit 1
          fi
          if [ -z "$SOURCE_SHA" ]; then
            echo "::error::PROMOTION_BLOCKED_MISSING_REVIEWED_SHA: supply the exact SHA shown in Preview."
            exit 1
          fi
          git fetch origin \
            "+refs/heads/development:refs/remotes/origin/development" \
            "+refs/heads/staging:refs/remotes/origin/staging" \
            "+refs/heads/production:refs/remotes/origin/production" \
            "+refs/heads/main:refs/remotes/origin/main"
          git cat-file -e "$SOURCE_SHA^{commit}"
          current_development_sha="$(git rev-parse origin/development)"
          if [ "$current_development_sha" != "$SOURCE_SHA" ]; then
            echo "::error::PROMOTION_BLOCKED_UNREVIEWED_DEVELOPMENT: development moved after Preview review. Review the new Preview first."
            exit 1
          fi
          source_sha="$SOURCE_SHA"
          echo "Reviewed development SHA: $source_sha"
          source_status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha/status" --jq .state)"
          if [ "$source_status" = "failure" ] || [ "$source_status" = "error" ]; then
            echo "::error::PROMOTION_BLOCKED_FAILED_SOURCE_CHECKS: development has failing checks."
            exit 1
          fi
          for target in staging production main; do
            target_sha="$(git rev-parse "origin/$target")"
            if ! git merge-base --is-ancestor "$target_sha" "$source_sha"; then
              echo "::error::PROMOTION_BLOCKED_DIVERGENCE: $target has commits outside development."
              exit 1
            fi
          done
          for target in staging production main; do
            git push origin "$source_sha:refs/heads/$target"
          done
